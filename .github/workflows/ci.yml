name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_DB: repomind_day52_ci
          POSTGRES_USER: repomind_ci
          POSTGRES_PASSWORD: repomind_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repomind_ci -d repomind_day52_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://repomind_ci:repomind_ci_test_only@127.0.0.1:5432/repomind_day52_ci
      DAY52_TEST_DATABASE_URL: postgresql+psycopg://repomind_ci:repomind_ci_test_only@127.0.0.1:5432/repomind_day52_ci
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_URL: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install --editable './backend[dev]' 'SQLAlchemy==2.0.52'
      - name: Check formatting
        run: python -m ruff format --check backend
      - name: Lint
        run: python -m ruff check backend
      - name: Typecheck
        run: python -m mypy backend
      - name: Migrate database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current
      - name: Verify database and Redis
        run: |
          python - <<'PY'
          import os
          from redis import Redis
          from sqlalchemy import create_engine, text

          assert os.environ["DATABASE_URL"] == os.environ["DAY52_TEST_DATABASE_URL"]
          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              with engine.connect() as connection:
                  assert connection.scalar(text("SELECT current_database()")) == "repomind_day52_ci"
                  assert connection.execute(text("SELECT version_num FROM alembic_version")).scalars().all() == ["0008"]
                  assert connection.scalar(text("SELECT extversion FROM pg_extension WHERE extname = 'vector'"))
          finally:
              engine.dispose()
          with Redis.from_url(os.environ["TEST_REDIS_URL"], socket_connect_timeout=5, socket_timeout=5) as client:
              assert client.ping()
          PY
      - name: Run backend tests
        run: python -m pytest backend -ra --junitxml=backend-test-results.xml
      - name: Require complete test coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("backend-test-results.xml").getroot()
          cases = list(root.iter("testcase"))
          if not cases:
              raise SystemExit("No backend tests executed")
          if any(list(root.iter(tag)) for tag in ("failure", "error", "skipped")):
              raise SystemExit("Backend tests contain failures, errors, or skips")
          expected = {
              "test_register_index_search_ask_with_repository_isolation",
              "test_duplicate_registration_keeps_original_indexable",
              "test_failed_reindex_retains_public_snapshot",
              "test_empty_supported_repository_bypasses_llm",
          }
          actual = [
              case.attrib["name"]
              for case in cases
              if case.attrib.get("classname", "").split(".")[-1] == "test_api_end_to_end"
          ]
          if set(actual) != expected or len(actual) != len(expected):
              raise SystemExit("All four Day 52 workflows must execute exactly once")
          print(f"Verified {len(cases)} passing tests, including all four Day 52 workflows")
          PY

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
